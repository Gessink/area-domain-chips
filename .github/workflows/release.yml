name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach:
    name: Attach dashboard resource to release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # HACS downloads `filename` from the release assets when a release exists,
      # so the file has to sit next to the release, not only in dist/.
      - name: Upload area-domain-chips.js
        uses: softprops/action-gh-release@v2
        with:
          files: dist/area-domain-chips.js
